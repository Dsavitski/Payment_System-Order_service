databaseChangeLog:
  - changeSet:
      id: create-orders
      author: Savitskiy
      changes:
        - createTable:
            tableName: orders
            columns:

              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: total_price
                  type: decimal(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: deleted
                  type: boolean
                  constraints:
                    nullable: false