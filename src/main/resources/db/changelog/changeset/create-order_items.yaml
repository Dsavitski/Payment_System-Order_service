databaseChangeLog:
  - changeSet:
      id: create-order_items
      author: Savitskiy
      changes:
        - createTable:
            tableName: order_items
            columns:

              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: order_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: item_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
